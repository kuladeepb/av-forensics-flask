{% extends "base.html" %}

{% block title %}Register User — AV-Forensics{% endblock %}

{% block content %}
<div class="max-w-md mx-auto my-12">
  <div class="bg-slate-900/60 border border-slate-800 rounded-2xl p-8 shadow-2xl backdrop-blur-sm">
    <div class="text-center mb-8">
      <div class="w-12 h-12 rounded-xl bg-blue-600/10 text-blue-500 border border-blue-500/20 flex items-center justify-center mx-auto mb-3">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"/>
        </svg>
      </div>
      <h2 class="text-2xl font-bold text-white tracking-tight">Create Lab Account</h2>
      <p class="text-xs text-slate-400 mt-1">Register for personal audit history and reporting</p>
    </div>

    <form method="POST" action="{{ url_for('register') }}" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1.5">Username</label>
        <input type="text" name="username" required placeholder="Select a username"
          class="w-full px-4 py-2.5 rounded-lg bg-slate-950 border border-slate-800 text-slate-100 placeholder-slate-600 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition text-sm">
      </div>

      <div>
        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1.5">Email (Optional)</label>
        <input type="email" name="email" placeholder="analyst@university.edu"
          class="w-full px-4 py-2.5 rounded-lg bg-slate-950 border border-slate-800 text-slate-100 placeholder-slate-600 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition text-sm">
      </div>

      <div>
        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1.5">Password</label>
        <input type="password" name="password" required placeholder="Choose a password"
          class="w-full px-4 py-2.5 rounded-lg bg-slate-950 border border-slate-800 text-slate-100 placeholder-slate-600 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition text-sm">
      </div>

      <div>
        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1.5">Confirm Password</label>
        <input type="password" name="confirm_password" required placeholder="Re-type password"
          class="w-full px-4 py-2.5 rounded-lg bg-slate-950 border border-slate-800 text-slate-100 placeholder-slate-600 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition text-sm">
      </div>

      <button type="submit"
        class="w-full mt-2 py-3 px-4 rounded-lg bg-blue-600 hover:bg-blue-500 text-white font-semibold text-sm shadow-lg shadow-blue-600/20 transition">
        Complete Registration
      </button>
    </form>

    <div class="mt-6 pt-6 border-t border-slate-800/80 text-center text-xs text-slate-500">
      Already registered? 
      <a href="{{ url_for('login') }}" class="text-blue-400 hover:underline font-medium">Sign in here</a>
    </div>
  </div>
</div>
{% endblock %}
