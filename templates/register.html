{% extends "base.html" %}

{% block title %}Register — AV-Forensics{% endblock %}

{% block content %}
<div class="min-h-[70vh] flex items-center justify-center py-10 px-4">
  <div class="w-full max-w-md bg-slate-900/90 border border-slate-800 rounded-2xl p-8 shadow-xl">
    
    <h2 class="text-2xl font-bold text-white text-center mb-6">Register</h2>

    <form method="POST" action="{{ url_for('register') }}" class="space-y-4">
      <div>
        <label class="block text-xs font-medium text-slate-300 mb-1.5">Name</label>
        <input type="text" name="username" required autofocus placeholder="Your name or username"
          class="w-full px-3.5 py-2.5 rounded-lg bg-slate-950 border border-slate-800 text-slate-100 placeholder-slate-500 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 text-sm">
      </div>

      <div>
        <label class="block text-xs font-medium text-slate-300 mb-1.5">Email</label>
        <input type="email" name="email" required placeholder="name@example.com"
          class="w-full px-3.5 py-2.5 rounded-lg bg-slate-950 border border-slate-800 text-slate-100 placeholder-slate-500 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 text-sm">
      </div>

      <div>
        <label class="block text-xs font-medium text-slate-300 mb-1.5">Password</label>
        <input type="password" name="password" required placeholder="••••••••"
          class="w-full px-3.5 py-2.5 rounded-lg bg-slate-950 border border-slate-800 text-slate-100 placeholder-slate-500 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 text-sm">
      </div>

      <div>
        <label class="block text-xs font-medium text-slate-300 mb-1.5">Confirm Password</label>
        <input type="password" name="confirm_password" required placeholder="••••••••"
          class="w-full px-3.5 py-2.5 rounded-lg bg-slate-950 border border-slate-800 text-slate-100 placeholder-slate-500 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 text-sm">
      </div>

      <button type="submit"
        class="w-full py-2.5 px-4 rounded-lg bg-blue-600 hover:bg-blue-500 text-white font-semibold text-sm shadow transition">
        Register
      </button>
    </form>

    <div class="mt-6 pt-5 border-t border-slate-800 text-center text-xs text-slate-400">
      Already have an account? 
      <a href="{{ url_for('login') }}" class="text-blue-400 hover:underline font-medium">Sign In</a>
    </div>

  </div>
</div>
{% endblock %}
