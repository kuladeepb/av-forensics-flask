{% extends "base.html" %}

{% block title %}Login — AV-Forensics{% endblock %}

{% block content %}
<div class="min-h-[70vh] flex items-center justify-center py-10 px-4">
  <div class="w-full max-w-md bg-slate-900/90 border border-slate-800 rounded-2xl p-8 shadow-xl">
    
    <h2 class="text-2xl font-bold text-white text-center mb-6">Login</h2>

    <form method="POST" action="{{ url_for('login') }}" class="space-y-4">
      <div>
        <label class="block text-xs font-medium text-slate-300 mb-1.5">Email</label>
        <input type="text" name="username" required autofocus placeholder="name@example.com"
          class="w-full px-3.5 py-2.5 rounded-lg bg-slate-950 border border-slate-800 text-slate-100 placeholder-slate-500 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 text-sm">
      </div>

      <div>
        <div class="flex items-center justify-between mb-1.5">
          <label class="block text-xs font-medium text-slate-300">Password</label>
          <a href="{{ url_for('forgot_password') }}" class="text-xs text-blue-400 hover:underline">Forgot password?</a>
        </div>
        <input type="password" name="password" required placeholder="••••••••"
          class="w-full px-3.5 py-2.5 rounded-lg bg-slate-950 border border-slate-800 text-slate-100 placeholder-slate-500 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 text-sm">
      </div>

      <div class="flex items-center">
        <label class="flex items-center gap-2 cursor-pointer text-xs text-slate-400 hover:text-slate-300">
          <input type="checkbox" name="remember" class="w-4 h-4 rounded bg-slate-950 border-slate-800 text-blue-600 focus:ring-0">
          <span>Remember me</span>
        </label>
      </div>

      <button type="submit"
        class="w-full py-2.5 px-4 rounded-lg bg-blue-600 hover:bg-blue-500 text-white font-semibold text-sm shadow transition">
        Sign In
      </button>
    </form>

    <div class="mt-6 pt-5 border-t border-slate-800 text-center text-xs text-slate-400">
      Don't have an account? 
      <a href="{{ url_for('register') }}" class="text-blue-400 hover:underline font-medium">Register</a>
    </div>

  </div>
</div>
{% endblock %}
