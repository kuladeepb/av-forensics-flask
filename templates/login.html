{% extends "base.html" %}

{% block title %}Sign In — AV-Forensics{% endblock %}

{% block content %}
<div class="max-w-md mx-auto my-12">
  <div class="bg-slate-900/60 border border-slate-800 rounded-2xl p-8 shadow-2xl backdrop-blur-sm">
    <div class="text-center mb-8">
      <div class="w-12 h-12 rounded-xl bg-blue-600/10 text-blue-500 border border-blue-500/20 flex items-center justify-center mx-auto mb-3">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
        </svg>
      </div>
      <h2 class="text-2xl font-bold text-white tracking-tight">Forensic Lab Access</h2>
      <p class="text-xs text-slate-400 mt-1">Sign in with your analyst credentials</p>
    </div>

    <form method="POST" action="{{ url_for('login') }}" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1.5">Username</label>
        <input type="text" name="username" required autofocus placeholder="e.g. admin or analyst"
          class="w-full px-4 py-2.5 rounded-lg bg-slate-950 border border-slate-800 text-slate-100 placeholder-slate-600 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition text-sm">
      </div>

      <div>
        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1.5">Password</label>
        <input type="password" name="password" required placeholder="••••••••"
          class="w-full px-4 py-2.5 rounded-lg bg-slate-950 border border-slate-800 text-slate-100 placeholder-slate-600 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition text-sm">
      </div>

      <button type="submit"
        class="w-full mt-2 py-3 px-4 rounded-lg bg-blue-600 hover:bg-blue-500 text-white font-semibold text-sm shadow-lg shadow-blue-600/20 transition flex items-center justify-center gap-2">
        <span>Authenticate & Enter Lab</span>
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/>
        </svg>
      </button>
    </form>

    <div class="mt-6 pt-6 border-t border-slate-800/80 text-center text-xs text-slate-500">
      Need a new lab account? 
      <a href="{{ url_for('register') }}" class="text-blue-400 hover:underline font-medium">Create User Profile</a>
      <div class="mt-3 p-2.5 rounded bg-slate-950/70 border border-slate-800/60 text-[11px] text-slate-400">
        Default Administrator: <span class="font-mono text-blue-300">admin</span> / <span class="font-mono text-blue-300">admin123</span>
      </div>
    </div>
  </div>
</div>
{% endblock %}
